    <style>
        :root {
            --bg-app: #f6f7f5;
            --text-main: #1e293b;
            --surface-glass: rgba(255, 255, 255, 0.92);
            --border-glass: rgba(203, 213, 225, 0.85);
            --shadow-glass: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
            --cloze-bg: #ffffff;
            --cloze-border: #cbd5e1;
            --cloze-text: #0f766e;
            --word-hover-bg: rgba(13, 148, 136, 0.14);
            --word-hover-text: #0f766e;
        }
        html.dark {
            --bg-app: #0f1419;
            --text-main: #f1f5f9;
            --surface-glass: rgba(22, 29, 38, 0.90);
            --border-glass: rgba(51, 65, 85, 0.72);
            --shadow-glass: 0 8px 28px -4px rgba(0, 0, 0, 0.35);
            --cloze-bg: #111822;
            --cloze-border: #334155;
            --cloze-text: #5eead4;
            --word-hover-bg: rgba(45, 212, 191, 0.18);
            --word-hover-text: #5eead4;
        }
        html, body {
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-app);
            color: var(--text-main);
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        .glass-panel {
            background: var(--surface-glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-glass);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        .cloze-input {
            background: var(--cloze-bg);
            border: 1.5px solid var(--cloze-border);
            border-radius: 0.6rem;
            padding: 0.25rem 0.6rem;
            color: var(--cloze-text);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 0.92rem;
            min-width: 6.5rem;
            max-width: min(100%, 82vw);
            text-align: center;
            transition: all 0.2s ease;
        }
        .cloze-input:focus {
            outline: none;
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.18);
        }
        .cloze-input.correct {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.14);
            color: #047857;
        }
        html.dark .cloze-input.correct {
            color: #6ee7b7;
        }
        .cloze-input.incorrect {
            border-color: #f43f5e;
            background: rgba(244, 63, 94, 0.14);
            color: #be123c;
        }
        html.dark .cloze-input.incorrect {
            color: #fda4af;
        }
        .word-token {
            cursor: pointer;
            border-radius: 0.3rem;
            padding: 0 2px;
            transition: background-color 0.15s ease, color 0.15s ease;
        }
        .word-token:hover {
            background-color: var(--word-hover-bg);
            color: var(--word-hover-text);
            text-decoration: underline dotted #0d9488;
        }
        @keyframes pulseWave {
            0%, 100% { transform: scaleY(0.35); }
            50% { transform: scaleY(1); }
        }
        .wave-bar {
            transform-origin: center;
            transition: transform 0.2s ease;
        }
        .wave-active .wave-bar {
            animation: pulseWave 0.75s ease-in-out infinite;
        }
        .wave-active .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-active .wave-bar:nth-child(3) { animation-delay: 0.22s; }
        .wave-active .wave-bar:nth-child(4) { animation-delay: 0.34s; }
        .wave-active .wave-bar:nth-child(5) { animation-delay: 0.18s; }
        .wave-active .wave-bar:nth-child(6) { animation-delay: 0.28s; }
        .wave-active .wave-bar:nth-child(7) { animation-delay: 0.08s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

            load() {
                try {
                    const raw = localStorage.getItem(this.storageKey) || localStorage.getItem(this.legacyKey);
                    if (!raw) return;
                    const saved = JSON.parse(raw);
                    const today = new Date().toISOString().slice(0, 10);

                    if (saved.theme === 'light' || saved.theme === 'dark') this.state.theme = saved.theme;
                    if (saved.level && LEVEL_ORDER.includes(saved.level)) this.state.level = saved.level;
                    if (typeof saved.customApiKey === 'string') this.state.customApiKey = saved.customApiKey;
                    if (saved.lexiconCache && typeof saved.lexiconCache === 'object') this.state.lexiconCache = saved.lexiconCache;
                    if (typeof saved.xp === 'number') this.state.xp = saved.xp;
                    if (typeof saved.streak === 'number') this.state.streak = saved.streak;
                    if (Array.isArray(saved.studiedTopics)) this.state.studiedTopics = saved.studiedTopics;
                    if (Array.isArray(saved.notebook)) this.state.notebook = saved.notebook;
                    if (saved.skills && typeof saved.skills === 'object') {
                        this.state.skills = { ...this.state.skills, ...saved.skills };
                    }

                    if (saved.savedDate === today) {
                        this.state.dailyXP = typeof saved.dailyXP === 'number' ? saved.dailyXP : 0;
                        this.state.dailyBonusClaimed = Boolean(saved.dailyBonusClaimed);
                    } else {
                        this.state.dailyXP = 0;
                        this.state.dailyBonusClaimed = false;
                    }
                } catch (e) {
                    console.warn('No se pudo restaurar el progreso guardado:', e);

                        savedDate: today

                    console.warn('No se pudo guardar el progreso:', e);
                }
            }
        }

        class GeminiService {
            constructor(app) {
                this.app = app;
                this.model = 'gemini-3-flash-preview';
            }

            getApiKey() {
                const custom = (this.app.storage.state.customApiKey || '').trim();
                if (custom) return custom;
                const apiKey = "";
                return apiKey;
            }

            async generateJson(prompt, systemInstruction = '', responseSchema = null) {
                const apiKey = this.getApiKey();
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${this.model}:generateContent?key=${apiKey}`;

                const generationConfig = {
                    responseMimeType: "application/json"
                };
                if (responseSchema) {
                    generationConfig.responseSchema = responseSchema;
                }

                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig
                };

                if (systemInstruction) {
                    payload.systemInstruction = { parts: [{ text: systemInstruction }] };
                }

                const delays = [1000, 2000, 4000];
                for (let attempt = 0; attempt <= delays.length; attempt++) {
                    try {
                        const res = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (!res.ok) {
                            if ((res.status === 429 || res.status >= 500) && attempt < delays.length) {
                                await new Promise(r => setTimeout(r, delays[attempt]));
                                continue;
                            }
                            return null;
                        }

                        const data = await res.json();
                        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (!rawText) return null;
                        return JSON.parse(rawText);
                    } catch (err) {
                        if (attempt < delays.length) {
                            await new Promise(r => setTimeout(r, delays[attempt]));
                            continue;
                        }
                        return null;
                    }
                }
                return null;
            }
        }

        class SpeechService {
            constructor() {
                this.isRecording = false;
                this.recognition = null;
                this.silenceTimer = null;
                this.ttsEndTimer = null;
                this.pendingTranscript = '';
                this.lastConfidence = 92;
                this.onFinalCallback = null;
                this.onStateCallback = null;
            }

            speak(text, rate = 1.0, onEnd = null) {
                if (!text || !('speechSynthesis' in window)) {
                    if (typeof onEnd === 'function') setTimeout(onEnd, 300);
                    return;
                }
                try {
                    clearTimeout(this.ttsEndTimer);
                    window.speechSynthesis.cancel();
                    const utter = new SpeechSynthesisUtterance(text);
                    utter.lang = 'en-US';
                    utter.rate = rate;
                    const voices = window.speechSynthesis.getVoices();
                    const preferred = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha')))
                        || voices.find(v => v.lang.startsWith('en'));
                    if (preferred) utter.voice = preferred;

                    let finished = false;
                    const done = () => {
                        if (finished) return;
                        finished = true;
                        clearTimeout(this.ttsEndTimer);
                        if (typeof onEnd === 'function') onEnd();
                    };

                    utter.onend = done;
                    utter.onerror = done;
                    const estimatedMs = Math.max(2500, Math.round((text.length * 68) / Math.max(0.6, rate)) + 1500);
                    this.ttsEndTimer = setTimeout(done, estimatedMs);

                    window.speechSynthesis.speak(utter);
                } catch (e) {
                    console.warn('Error en síntesis de voz:', e);
                    if (typeof onEnd === 'function') setTimeout(onEnd, 300);
                }
            }

            cancelSpeech() {
                clearTimeout(this.ttsEndTimer);
                if ('speechSynthesis' in window) {
                    try { window.speechSynthesis.cancel(); } catch (e) {}
                }
            }

            startListening({ onInterim, onFinal, onStateChange, onError } = {}) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    if (typeof onError === 'function') {
                        onError('Tu navegador no soporta reconocimiento de voz. Usa Chrome/Edge o escribe tu respuesta abajo.');
                    }
                    return false;
                }

                this.stopListening(false);
                this.cancelSpeech();
                this.pendingTranscript = '';
                this.onFinalCallback = onFinal;
                this.onStateCallback = onStateChange;

                try {
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'en-US';
                    recognition.continuous = true;
                    recognition.interimResults = true;
                    recognition.maxAlternatives = 1;

                    recognition.onstart = () => {
                        this.isRecording = true;
                        if (typeof onStateChange === 'function') onStateChange(true);
                    };

                    recognition.onresult = (event) => {
                        let finalChunk = '';
                        let interimChunk = '';
                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            const res = event.results[i];
                            const transcript = res[0]?.transcript || '';
                            if (res.isFinal) {
                                finalChunk += transcript + ' ';
                                if (typeof res[0]?.confidence === 'number' && res[0].confidence > 0) {
                                    this.lastConfidence = Math.min(99, Math.max(65, Math.round(res[0].confidence * 100)));
                                }
                            } else {
                                interimChunk += transcript;
                            }
                        }

                        if (finalChunk.trim()) {
                            this.pendingTranscript = `${this.pendingTranscript} ${finalChunk}`.trim();
                        }

                        const combined = `${this.pendingTranscript} ${interimChunk}`.trim();
                        if (typeof onInterim === 'function') onInterim(combined);

                        clearTimeout(this.silenceTimer);
                        if (combined) {
                            this.silenceTimer = setTimeout(() => {
                                this.flushPending();
                            }, 2800);
                        }
                    };

                    recognition.onerror = (event) => {
                        if (event.error === 'no-speech') return;
                        this.isRecording = false;
                        clearTimeout(this.silenceTimer);
                        if (typeof onStateChange === 'function') onStateChange(false);
                        if (typeof onError === 'function' && event.error !== 'aborted') {
                            onError(`Error de micrófono (${event.error}). Verifica los permisos del navegador.`);
                        }
                    };

                    recognition.onend = () => {
                        clearTimeout(this.silenceTimer);
                        const wasRecording = this.isRecording;
                        this.isRecording = false;
                        if (typeof onStateChange === 'function') onStateChange(false);
                        if (wasRecording && this.pendingTranscript.trim()) {
                            const text = this.pendingTranscript.trim();
                            this.pendingTranscript = '';
                            if (typeof this.onFinalCallback === 'function') {
                                this.onFinalCallback(text, this.lastConfidence);
                            }
                        }
                    };

                    this.recognition = recognition;
                    recognition.start();
                    return true;
                } catch (err) {
                    this.isRecording = false;
                    if (typeof onError === 'function') {
                        onError('No se pudo iniciar el micrófono. Revisa los permisos.');
                    }
                    return false;
                }
            }

            flushPending() {
                clearTimeout(this.silenceTimer);
                const text = this.pendingTranscript.trim();
                this.pendingTranscript = '';
                this.isRecording = false;
                if (this.recognition) {
                    try { this.recognition.stop(); } catch (e) {}
                }
                if (typeof this.onStateCallback === 'function') this.onStateCallback(false);
                if (text && typeof this.onFinalCallback === 'function') {
                    this.onFinalCallback(text, this.lastConfidence);
                }
            }

            stopListening(flush = false) {
                clearTimeout(this.silenceTimer);
                if (flush) {
                    this.flushPending();
                    return;
                }
                this.pendingTranscript = '';
                this.isRecording = false;
                if (this.recognition) {
                    try { this.recognition.abort(); } catch (e) {}
                    this.recognition = null;
                }
                if (typeof this.onStateCallback === 'function') this.onStateCallback(false);
            }
        }

        class DomHelper {
            static escapeHtml(str) {
                return String(str ?? '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            static makeWordsInteractive(text) {
                const escaped = DomHelper.escapeHtml(text);
                return escaped.replace(/\b([A-Za-z]{2,}(?:'[A-Za-z]+)?)\b/g, (match) => {
                    return `<span class="word-token" data-action="inspect-word" data-word="${match}">${match}</span>`;

                        </button>
                    </div>
                `;

                this.app.refreshIcons();
            }

            async inspect(word) {
                const clean = String(word || '').trim();
                if (!clean || !this.container) return;
                const key = clean.toLowerCase();
                const level = this.app.storage.state.level;
                const cached = LEXICON_DICT[key] || this.app.storage.state.lexiconCache[key];

                this.app.speech.speak(clean, 0.9);

                if (cached) {
                    this.renderCard(clean, cached.pos, cached.es, false);
                    return;
                }

                this.renderCard(clean, `CEFR ${level}`, '', true);

                const schema = {
                    type: "OBJECT",
                    properties: {
                        pos: { type: "STRING" },
                        es: { type: "STRING" }
                    },
                    required: ["pos", "es"]
                };
                const prompt = `Traduce y explica brevemente al español la palabra en inglés "${clean}" (nivel CEFR ${level}). Devuelve JSON con "pos" (categoría gramatical corta, ej: "verb", "noun", "adj.", "adv.") y "es" (traducción principal al español + matiz de uso en máximo 12 palabras).`;
                const aiRes = await this.app.gemini.generateJson(prompt, '', schema);

                if (aiRes && aiRes.es) {
                    const entry = { pos: aiRes.pos || `CEFR ${level}`, es: aiRes.es };
                    this.app.storage.state.lexiconCache[key] = entry;
                    this.app.storage.save();
                    if (this.currentWord && this.currentWord.word.toLowerCase() === key) {
                        this.renderCard(clean, entry.pos, entry.es, false);
                    }
                } else {
                    const fallbackMeaning = `Término en contexto (${level}). Escucha su pronunciación o guárdalo en tu cuaderno para repasarlo.`;
                    if (this.currentWord && this.currentWord.word.toLowerCase() === key) {
                        this.renderCard(clean, `CEFR ${level}`, fallbackMeaning, false);
                    }
                }
            }

            close() {
                if (this.container) this.container.classList.add('hidden');
            }

            saveCurrent() {
                if (!this.currentWord) return;
                const { word, pos, meaning } = this.currentWord;
                this.app.notebook.addEntry(
                    `Vocabulario: ${word} (${pos})`,
                    word,
                    meaning,
                    `Inspector Léxico · ${this.app.storage.state.level}`
                );
                this.app.showToast(`"${word}" guardado en tu Cuaderno`);
            }
        }

        class PracticeModule {
            constructor(app) {
                this.app = app;
                this.container = document.getElementById('view-practice');
                this.activeExercises = [];
                this.filteredIndices = [];
                this.currentStep = 0;
                this.filterType = 'ALL';
                this.topicFocus = '';
                this.sessionAnswers = {};
                this.isGenerating = false;
            }

            loadForLevel(level, topicFocus = '') {
                this.topicFocus = topicFocus;
                this.filterType = 'ALL';
                this.sessionAnswers = {};
                const base = Array.isArray(EXERCISES_BY_LEVEL[level]) ? EXERCISES_BY_LEVEL[level] : EXERCISES_BY_LEVEL.B1;
                this.activeExercises = JSON.parse(JSON.stringify(base));
                this.applyFilter();
                if (topicFocus) {
                    this.generateNewSet();
                }
            }

            applyFilter() {
                this.filteredIndices = this.activeExercises
                    .map((ex, idx) => ({ ex, idx }))
                    .filter(({ ex }) => this.filterType === 'ALL' || ex.type === this.filterType)
                    .map(({ idx }) => idx);
                this.currentStep = 0;
                this.render();
            }

            getCurrentExercise() {
                if (this.currentStep >= this.filteredIndices.length) return null;
                const realIdx = this.filteredIndices[this.currentStep];
                return { realIdx, ex: this.activeExercises[realIdx] };
            }

            handleAbcdAnswer(optIdx) {
                const current = this.getCurrentExercise();
                if (!current) return;
                const { realIdx, ex } = current;
                if (this.sessionAnswers[realIdx]) return;

                const isCorrect = optIdx === ex.correctIndex;
                this.sessionAnswers[realIdx] = {
                    answered: true,
                    isCorrect,
                    selectedIdx: optIdx
                };

                if (isCorrect) {
                    this.app.awardXP(20, 'grammar');
                } else {
                    this.app.notebook.addEntry(
                        `Elegiste: "${ex.options[optIdx]}"`,
                        ex.options[ex.correctIndex],
                        ex.explanation,
                        `Práctica ABCD · ${this.app.storage.state.level}`
                    );
                }
                this.render();
            }

            handleClozeCheck() {
                const current = this.getCurrentExercise();
                if (!current) return;
                const { realIdx, ex } = current;
                if (this.sessionAnswers[realIdx]?.answered) return;

                const inputs = Array.from(this.container.querySelectorAll('.cloze-input'));
                const userValues = inputs.map(inp => inp.value.trim());
                if (userValues.some(v => !v)) {
                    this.app.showToast('Completa todos los espacios antes de comprobar');
                    return;
                }

                const normalize = (s) => s.toLowerCase().replace(/[.,!?;:'"]/g, '').replace(/\s+/g, ' ').trim();
                const results = ex.blanks.map((blank, idx) => {
                    const acceptedList = blank.answer.split('|').map(normalize);
                    return acceptedList.includes(normalize(userValues[idx]));
                });

                const allCorrect = results.every(Boolean);
                this.sessionAnswers[realIdx] = {
                    answered: true,
                    isCorrect: allCorrect,
                    userValues,
                    results
                };

                if (allCorrect) {
                    this.app.awardXP(25, 'grammar');
                } else {
                    const expectedSentence = ex.blanks.map(b => b.answer.split('|')[0]).join(' / ');
                    this.app.notebook.addEntry(
                        `Tus respuestas: ${userValues.join(' / ')}`,
                        expectedSentence,
                        ex.explanation,
                        `Práctica Cloze · ${this.app.storage.state.level}`
                    );
                }
                this.render();
            }

            handleRewriteCheck() {
                const current = this.getCurrentExercise();
                if (!current) return;
                const { realIdx, ex } = current;
                if (this.sessionAnswers[realIdx]?.answered) return;

                const textarea = document.getElementById('rewrite-input');
                const userText = (textarea?.value || '').trim();
                if (!userText) {
                    this.app.showToast('Escribe tu traducción o transformación en inglés');
                    return;
                }

                const lower = userText.toLowerCase();
                const matchedKeys = (ex.keyPoints || []).filter(kp => lower.includes(kp.toLowerCase()));
                const isCorrect = matchedKeys.length >= Math.max(1, Math.ceil((ex.keyPoints || []).length * 0.65));

                this.sessionAnswers[realIdx] = {
                    answered: true,
                    isCorrect,
                    userText,
                    matchedKeys
                };

                if (isCorrect) {
                    this.app.awardXP(30, 'syntax');
                } else {
                    this.app.notebook.addEntry(
                        userText,
                        ex.targetEnglish,
                        ex.explanation,
                        `Reescritura · ${this.app.storage.state.level}`
                    );
                }
                this.render();
            }

            handleDictationCheck() {
                const current = this.getCurrentExercise();
                if (!current) return;
                const { realIdx, ex } = current;
                if (this.sessionAnswers[realIdx]?.answered) return;

                const input = document.getElementById('dictation-input');
                const userText = (input?.value || '').trim();
                if (!userText) {
                    this.app.showToast('Escribe lo que escuchaste en el audio');
                    return;
                }

                const cleanWords = (str) => str.toLowerCase().replace(/[.,!?;:"]/g, '').split(/\s+/).filter(Boolean);
                const targetWords = cleanWords(ex.audioText);
                const userWords = cleanWords(userText);

                let hits = 0;
                targetWords.forEach((w, idx) => {
                    if (userWords[idx] === w || userWords.includes(w)) hits++;
                });
                const accuracy = Math.round((hits / Math.max(1, targetWords.length)) * 100);
                const isCorrect = accuracy >= 80;

                this.sessionAnswers[realIdx] = {
                    answered: true,
                    isCorrect,
                    userText,
                    accuracy
                };

                if (isCorrect) {
                    this.app.awardXP(25, 'listening');
                } else {
                    this.app.notebook.addEntry(
                        `Dictado (${accuracy}%): ${userText}`,
                        ex.audioText,
                        ex.explanation,
                        `Dictado Audio · ${this.app.storage.state.level}`
                    );
                }
                this.render();
            }

                if (this.currentStep < this.filteredIndices.length) {

                if (this.currentStep > 0) {

        class VoiceTutorModule {
            constructor(app) {
                this.app = app;
                this.container = document.getElementById('view-voice');
                this.scenario = 'Free Conversation';
                this.mode = 'natural';
                this.ttsRate = 1.0;
                this.handsFree = false;
                this.isAnalyzing = false;
                this.showScaffolding = false;
                this.chatHistory = [];
                this.feedbackItems = [];
                this.shadowingTarget = null;
                this.shadowingResult = null;
                this.liveTranscript = '';

                this.scaffoldingBank = {
                    A1: ["Hello! My name is... and I am from...", "I usually work from Monday to Friday.", "Could you please repeat that slowly?"],
                    A2: ["Last weekend I went to... and it was really fun.", "In my opinion, I prefer... because it is easier.", "I'm planning to travel next month if I have time."],
                    B1: ["I've been working on this project for several months now.", "Despite facing a few challenges, I think we made good progress.", "If I had more free time, I would definitely focus on..."],
                    B2: ["From my perspective, the main advantage lies in...", "Had we anticipated that bottleneck earlier, we could have avoided delays.", "What strikes me most about this topic is..."],
                    C1: ["Not only does this approach enhance efficiency, but it also mitigates risk.", "Notwithstanding those concerns, empirical evidence suggests otherwise.", "I would argue that long-term sustainability hinges upon..."],
                    C2: ["Far from being a peripheral issue, this lies at the very heart of the debate.", "Compelling though that premise may appear, it warrants closer scrutiny.", "Be that as it may, we cannot afford to overlook the broader implications."]
                };
            }

            toggleHandsFree() {
                this.handsFree = !this.handsFree;
                this.render();
                if (this.handsFree) {
                    this.app.showToast('📞 Modo Llamada Manos Libres activado');
                    if (!this.app.speech.isRecording) {
                        this.toggleMicrophone();
                    }
                } else {
                    this.app.showToast('Modo Manos Libres desactivado');
                }
            }

            reset() {
                this.app.speech.cancelSpeech();
                const level = this.app.storage.state.level;
                const openers = {
                    'Free Conversation': {
                        A1: "Hi! Welcome to our free conversation session. What is your name, and what do you like doing in your free time?",
                        A2: "Hello! Today we can talk about anything you like. Tell me, what have you been doing this week?",
                        B1: "Hey there! Welcome to Free Talk mode. What topic, hobby, or current project would you like to discuss today?",
                        B2: "Welcome! Since this is an open conversation, feel free to steer the topic. What's been on your mind lately—work, culture, or technology?",
                        C1: "Good to see you! In this open session, we can explore any nuanced topic you'd like. What issue or idea has captured your curiosity recently?",
                        C2: "Delighted to converse with you. Consider the floor entirely yours—what intellectual, cultural, or professional subject shall we dissect today?"
                    },
                    'Tech Startup Job Interview': { default: "Welcome! Thanks for joining us today. To kick things off, could you tell me about a challenging project you worked on and how you solved key obstacles?" },
                    'International Airport & Customs': { default: "Good afternoon! May I see your passport and boarding pass, please? What is the purpose of your visit and how long will you be staying?" },
                    'Cozy Coffee Shop Debate': { default: "Hey! Grab a seat. I was just reading an article about whether remote work makes people happier or more isolated. What's your take?" },
                    'Negotiating a Creative Project': { default: "Thanks for meeting with us. We love your portfolio, though our timeline is tight. How would you structure the milestones for this launch?" },
                    'Ethical AI & Philosophy Panel': { default: "Welcome to the panel. As autonomous systems become more pervasive, where should we draw the line between efficiency and human accountability?" }
                };

                const scObj = openers[this.scenario] || openers['Free Conversation'];
                const firstMsg = scObj[level] || scObj.default || scObj.B1;

                this.chatHistory = [{ role: 'tutor', text: firstMsg, showTranslation: false, translationData: null }];
                this.feedbackItems = [];
                this.shadowingTarget = null;
                this.shadowingResult = null;
                this.isAnalyzing = false;
                this.render();
            }

            toggleMicrophone() {
                if (this.app.speech.isRecording) {
                    this.app.speech.flushPending();
                    return;
                }

                this.liveTranscript = '';
                const started = this.app.speech.startListening({
                    onInterim: (text) => {
                        this.liveTranscript = text;
                        const input = document.getElementById('voice-text-input');
                        if (input) input.value = text;
                    },
                    onFinal: (finalText, confidence) => {
                        this.liveTranscript = '';
                        const input = document.getElementById('voice-text-input');
                        if (input) input.value = '';
                        this.processUtterance(finalText, confidence);
                    },
                    onStateChange: () => {
                        this.render();
                    },
                    onError: (msg) => {
                        this.app.showToast(msg);
                        this.render();
                    }
                });
                if (started) this.render();
            }

            sendDraftText() {
                const input = document.getElementById('voice-text-input');
                const val = (input?.value || '').trim();
                if (!val) {
                    this.app.showToast('Habla por el micrófono o escribe un mensaje en inglés');
                    return;
                }
                if (this.app.speech.isRecording) {
                    this.app.speech.stopListening(false);
                }
                input.value = '';
                this.liveTranscript = '';
                this.processUtterance(val, null);
            }

            startShadowing(targetText) {
                this.shadowingTarget = targetText;
                this.shadowingResult = null;
                this.app.speech.speak(targetText, 0.85);
                this.render();
            }

            evaluateShadowing(spokenText) {
                const clean = (s) => s.toLowerCase().replace(/[.,!?;:'"]/g, '').split(/\s+/).filter(Boolean);
                const targetWords = clean(this.shadowingTarget);
                const spokenWords = clean(spokenText);

                let hits = 0;
                const wordComparison = targetWords.map((w, idx) => {
                    const matched = spokenWords[idx] === w || spokenWords.includes(w);
                    if (matched) hits++;
                    return { word: w, matched };
                });

                const score = Math.round((hits / Math.max(1, targetWords.length)) * 100);
                this.shadowingResult = { spokenText, score, wordComparison };
                if (score >= 75) {
                    this.app.awardXP(20, 'speaking');
                }
                this.render();
            }

            async toggleTranslation(msgIdx) {
                const msg = this.chatHistory[msgIdx];
                if (!msg || msg.role !== 'tutor') return;
                msg.showTranslation = !msg.showTranslation;

                if (msg.showTranslation && !msg.translationData) {
                    msg.translationData = { translation: 'Traduciendo y extrayendo vocabulario...', glossary: [], loading: true };
                    this.render();

                    const schema = {
                        type: "OBJECT",
                        properties: {
                            translation: { type: "STRING" },
                            glossary: { type: "ARRAY", items: { type: "STRING" } }
                        },
                        required: ["translation", "glossary"]
                    };
                    const prompt = `Traduce al español de forma natural esta frase de un tutor de inglés (nivel ${this.app.storage.state.level}): "${msg.text}". Incluye además en "glossary" 2 a 4 palabras o expresiones clave de la frase con su significado en español (formato "palabra/expresión: significado").`;
                    const aiRes = await this.app.gemini.generateJson(prompt, '', schema);

                    if (aiRes && aiRes.translation) {
                        msg.translationData = {
                            translation: aiRes.translation,
                            glossary: Array.isArray(aiRes.glossary) ? aiRes.glossary : [],
                            loading: false
                        };
                    } else {
                        const words = msg.text.match(/[A-Za-z]{5,}/g) || [];
                        const unique = [...new Set(words.map(w => w.toLowerCase()))].slice(0, 4);
                        const glossary = unique.map(w => {
                            const hit = LEXICON_DICT[w];
                            return hit
                                ? `${w}: ${hit.es}`
                                : `${w}: haz clic sobre la palabra arriba para ver su traducción`;
                        });
                        msg.translationData = {
                            translation: "Traducción contextual: El tutor te invita a responder en inglés manteniendo el hilo de la conversación. Haz clic sobre cualquier palabra arriba para ver su significado.",
                            glossary,
                            loading: false
                        };
                    }
                }
                this.render();
            }

            analyzeUtterance(text) {
                const rules = [
                    {
                        regex: /\bI\s+have\s+(\d+|twenty|thirty|forty|fifty)\s+years\b/i,
                        fix: (m) => m.replace(/I\s+have/i, 'I am'),
                        exp: "En inglés la edad se expresa con el verbo 'to be' ('I am ... years old'), nunca con 'have'."
                    },
                    {
                        regex: /\bsince\s+(\d+|two|three|four|five|six|many)\s+(years|months|weeks|days)\b/i,
                        fix: (m) => m.replace(/since/i, 'for'),
                        exp: "Usa 'for' para períodos de duración ('for three years') y 'since' para puntos concretos de inicio ('since 2022')."
                    },
                    {
                        regex: /\bI\s+am\s+agree\b/i,
                        fix: (m) => m.replace(/I\s+am\s+agree/i, 'I agree'),
                        exp: "'Agree' es un verbo en inglés, por lo que no lleva 'am/is/are' delante ('I agree')."
                    },
                    {
                        regex: /\bdepend\s+of\b/i,
                        fix: (m) => m.replace(/depend\s+of/i, 'depend on'),
                        exp: "El verbo 'depend' rige siempre la preposición 'on' ('depend on'), nunca 'of'."
                    }
                ];

                for (const rule of rules) {
                    if (rule.regex.test(text)) {
                        return {
                            hasError: true,
                            original: text,
                            corrected: text.replace(rule.regex, rule.fix),
                            explanation: rule.exp
                        };
                    }
                }

                return {
                    hasError: false,
                    original: text,
                    corrected: text,
                    explanation: "¡Estructura natural y comprensible! Sigue manteniendo ese ritmo."
                };
            }

            buildTutorReply(analysis) {
                if (this.mode === 'strict' && analysis.hasError) {
                    return `Good effort! Just a quick refinement: try saying "${analysis.corrected}". Could you repeat that version for me?`;
                }
                const followUps = [
                    "That's a very interesting perspective! Could you elaborate a bit more on why you think so?",
                    "I see what you mean. How does that compare to your experience over the last couple of years?",
                    "Great point! What do you think would happen if circumstances changed unexpectedly?"
                ];
                return followUps[this.chatHistory.length % followUps.length];
            }

            async processUtterance(text, confidence = null) {
                if (this.shadowingTarget) {
                    this.evaluateShadowing(text);
                    return;
                }

                this.chatHistory.push({ role: 'user', text, confidence });
                this.isAnalyzing = true;
                this.render();

                const level = this.app.storage.state.level;
                const recentTurns = this.chatHistory
                    .slice(-6)
                    .map(m => `${m.role === 'user' ? 'Student' : 'Tutor'}: ${m.text}`)
                    .join('\n');

                const schema = {
                    type: "OBJECT",
                    properties: {
                        hasError: { type: "BOOLEAN" },
                        corrected: { type: "STRING" },
                        explanation: { type: "STRING" },
                        tutorReply: { type: "STRING" }
                    },
                    required: ["hasError", "corrected", "explanation", "tutorReply"]
                };

                const systemInstruction = `Eres un tutor conversacional experto de inglés para hispanohablantes. Nivel objetivo del estudiante: CEFR ${level}. Escenario: "${this.scenario}". Modo de corrección: ${this.mode === 'strict' ? 'Estricto (si hay error gramatical o léxico relevante, pídele amablemente repetir la frase corregida antes de continuar)' : 'Flujo Natural (mantén la conversación viva y fluida haciendo una pregunta abierta acorde al nivel)'}.`;

                const prompt = `Historial reciente:
${recentTurns}

Analiza la última intervención del estudiante: "${text}"
Devuelve un JSON con:
- "hasError": true si hay error gramatical, de tiempo verbal, preposición, artículo o expresión antinatural (ignora puntuación o mayúsculas menores de dictado por voz); false si es correcta y natural.
- "corrected": la versión corregida o más natural en inglés (si hasError es false, repite la frase pulida).
- "explanation": explicación breve, clara y pedagógica en español (1-2 frases).
- "tutorReply": tu respuesta conversacional en inglés adaptada exactamente al nivel ${level}, continuando el tema del estudiante de forma natural y entretenida.`;

                const aiResult = await this.app.gemini.generateJson(prompt, systemInstruction, schema);

                let analysis;
                let reply;

                if (aiResult && aiResult.tutorReply) {
                    analysis = {
                        hasError: Boolean(aiResult.hasError),
                        original: text,
                        corrected: aiResult.corrected || text,
                        explanation: aiResult.explanation || 'Buena intervención.'
                    };
                    reply = aiResult.tutorReply;
                } else {
                    analysis = this.analyzeUtterance(text);
                    reply = this.buildTutorReply(analysis);
                }

                this.isAnalyzing = false;
                this.feedbackItems.unshift(analysis);

                if (analysis.hasError) {
                    this.app.notebook.addEntry(
                        analysis.original,
                        analysis.corrected,
                        analysis.explanation,
                        `Tutor de Voz · ${level}`
                    );
                } else {
                    this.app.awardXP(15, 'speaking');

        class NotebookModule {
            constructor(app) {
                this.app = app;
                this.container = document.getElementById('view-notebook');
                this.recallStatus = {};

            addEntry(original, corrected, explanation, source) {
                const list = this.app.storage.state.notebook;
                const exists = list.some(item => item.corrected.toLowerCase() === corrected.toLowerCase());
                if (!exists) {
                    list.unshift({ original, corrected, explanation, source });
                    this.app.storage.save();
                }
                this.app.updateHeaderMetrics();
            }

            checkRecall(idx) {
                const item = this.app.storage.state.notebook[idx];
                if (!item) return;
                const input = document.getElementById(`recall-input-${idx}`);
                const userVal = (input?.value || '').trim();
                if (!userVal) {
                    this.app.showToast('Escribe de memoria la forma correcta antes de validar');
                    return;
                }
                const norm = (s) => s.toLowerCase().replace(/[.,!?;:'"]/g, '').replace(/\s+/g, ' ').trim();
                const ok = norm(userVal) === norm(item.corrected);
                this.recallStatus[idx] = { attempted: true, ok, userVal };
                if (ok) {
                    this.app.showToast('¡Exacto! Ya puedes marcarla como dominada (+25 XP)');
                } else {
                    this.app.showToast('Revisa los detalles e inténtalo de nuevo');
                }
                this.render();
            }

            masterItem(idx) {
                this.app.storage.state.notebook.splice(idx, 1);
                delete this.recallStatus[idx];
                this.app.storage.save();
                this.app.awardXP(25, 'grammar');
                this.app.showToast('¡Estructura dominada y archivada! (+25 XP)');
                this.render();
            }

            deleteItem(idx) {
                this.app.storage.state.notebook.splice(idx, 1);

                this.app.storage.save();

        class PlacementTestModule {
            constructor(app) {
                this.app = app;
                this.totalQuestions = 30;
                this.currentIdx = 0;
                this.bandIndex = 2; // inicia en B1
                this.usedKeys = new Set();
                this.history = [];
                this.currentItem = null;
                this.skillStats = {
                    grammar: { ok: 0, total: 0 },
                    reading: { ok: 0, total: 0 },
                    listening: { ok: 0, total: 0 },
                    production: { ok: 0, total: 0 }
                };
            }

            open() {
                this.currentIdx = 0;
                this.bandIndex = 2;
                this.usedKeys.clear();
                this.history = [];
                this.skillStats = {
                    grammar: { ok: 0, total: 0 },
                    reading: { ok: 0, total: 0 },
                    listening: { ok: 0, total: 0 },
                    production: { ok: 0, total: 0 }
                };
                this.pickNextQuestion();
                this.render();
                this.app.openModal();
            }

            pickNextQuestion() {
                const skillsOrder = ['grammar', 'reading', 'listening', 'production'];
                const targetSkill = skillsOrder[this.currentIdx % skillsOrder.length];
                const candidateBands = [
                    this.bandIndex,
                    Math.min(5, this.bandIndex + 1),
                    Math.max(0, this.bandIndex - 1),
                    0, 1, 2, 3, 4, 5
                ];

                for (const bIdx of candidateBands) {
                    const lvl = LEVEL_ORDER[bIdx];
                    const pool = PLACEMENT_POOL[lvl] || [];
                    for (let i = 0; i < pool.length; i++) {
                        const key = `${lvl}-${i}`;
                        if (!this.usedKeys.has(key) && pool[i].skill === targetSkill) {
                            this.usedKeys.add(key);
                            this.currentItem = { ...pool[i], level: lvl, bandIdx: bIdx };
                            return;
                        }
                    }
                }

                for (const bIdx of candidateBands) {
                    const lvl = LEVEL_ORDER[bIdx];
                    const pool = PLACEMENT_POOL[lvl] || [];
                    for (let i = 0; i < pool.length; i++) {
                        const key = `${lvl}-${i}`;
                        if (!this.usedKeys.has(key)) {
                            this.usedKeys.add(key);
                            this.currentItem = { ...pool[i], level: lvl, bandIdx: bIdx };
                            return;
                        }
                    }
                }

                this.currentItem = null;
            }

            submitAbcd(optIdx) {
                if (!this.currentItem) return;
                const isCorrect = optIdx === this.currentItem.correctIndex;
                this.recordAnswer(isCorrect);
            }

            submitCloze() {
                if (!this.currentItem) return;
                const input = document.getElementById('placement-cloze-input');
                const val = (input?.value || '').trim();
                if (!val) {
                    this.app.showToast('Escribe tu respuesta para continuar');
                    return;
                }
                const norm = (s) => s.toLowerCase().replace(/[.,!?;:'"]/g, '').trim();
                const accepted = this.currentItem.answer.split('|').map(norm);
                this.recordAnswer(accepted.includes(norm(val)));
            }

            recordAnswer(isCorrect) {
                const item = this.currentItem;
                this.skillStats[item.skill].total++;
                if (isCorrect) this.skillStats[item.skill].ok++;

                this.history.push({ level: item.level, bandIdx: item.bandIdx, isCorrect, skill: item.skill });

                if (isCorrect) {
                    this.bandIndex = Math.min(5, this.bandIndex + 1);
                } else {
                    this.bandIndex = Math.max(0, this.bandIndex - 1);
                }

                this.currentIdx++;
                if (this.currentIdx >= this.totalQuestions) {
                    this.app.awardXP(100, 'grammar');
                    this.renderReport();
                } else {
                    this.pickNextQuestion();
                    if (!this.currentItem) {
                        this.renderReport();
                    } else {
                        this.render();
                    }
                }
            }

            calculateRecommendedLevel() {
                if (this.history.length === 0) return 'B1';
                const recent = this.history.slice(-10);
                let weighted = 0;
                recent.forEach(h => {
                    weighted += h.isCorrect ? (h.bandIdx + 0.5) : Math.max(0, h.bandIdx - 0.5);
                });
                const avg = Math.round(weighted / recent.length);
                return LEVEL_ORDER[Math.min(5, Math.max(0, avg))];
            }

        class SyntaxBuilderModule {
            constructor(app) {
                this.app = app;
                this.challengeIdx = 0;
                this.bankTokens = [];
                this.selectedIndices = [];
                this.checked = false;
                this.isCorrect = false;
            }

            open() {
                this.challengeIdx = 0;
                this.loadChallenge();
                this.app.openModal();
            }

            loadChallenge() {
                const level = this.app.storage.state.level;
                const list = SYNTAX_BUILDER_DATA[level] || SYNTAX_BUILDER_DATA.B1;
                const item = list[this.challengeIdx % list.length];
                const combined = [...item.tokens, ...(item.distractors || [])];
                for (let i = combined.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [combined[i], combined[j]] = [combined[j], combined[i]];
                }
                this.bankTokens = combined;
                this.selectedIndices = [];
                this.checked = false;
                this.isCorrect = false;
                this.render();
            }

            pickToken(tokenIdx) {
                if (this.checked || this.selectedIndices.includes(tokenIdx)) return;
                this.selectedIndices.push(tokenIdx);
                this.render();
            }

            removeToken(posIdx) {
                if (this.checked) return;
                this.selectedIndices.splice(posIdx, 1);
                this.render();
            }

            clear() {
                this.selectedIndices = [];
                this.checked = false;
                this.isCorrect = false;
                this.render();
            }

            check() {
                const level = this.app.storage.state.level;
                const list = SYNTAX_BUILDER_DATA[level] || SYNTAX_BUILDER_DATA.B1;
                const item = list[this.challengeIdx % list.length];

                const built = this.selectedIndices.map(i => this.bankTokens[i]).join(' ');
                const target = item.tokens.join(' ');
                if (!built) {
                    this.app.showToast('Selecciona bloques para construir la oración');
                    return;
                }
                this.checked = true;
                this.isCorrect = built === target;
                if (this.isCorrect) {
                    this.app.awardXP(30, 'syntax');
                    this.app.speech.speak(target, 0.95);
                }
                this.render();
            }

        class FluentLabApp {
            constructor() {
                this.activeTab = 'syllabus';
                this.toastTimer = null;
                this.modalBackdrop = document.getElementById('app-modal-backdrop');
                this.modalDialog = document.getElementById('app-modal-dialog');

                this.storage = new StorageManager();
                this.gemini = new GeminiService(this);
                this.speech = new SpeechService();
                this.lexicon = new LexiconInspector(this);
                this.syllabus = new SyllabusModule(this);
                this.practice = new PracticeModule(this);
                this.voice = new VoiceTutorModule(this);
                this.notebook = new NotebookModule(this);
                this.placement = new PlacementTestModule(this);
                this.syntax = new SyntaxBuilderModule(this);
                this.skills = new SkillsDashboardModule(this);
                this.aiSettings = new AiSettingsModule(this);
            }

            init() {
                this.storage.load();
                this.applyTheme(this.storage.state.theme);
                this.bindGlobalEvents();
                this.setLevel(this.storage.state.level, true);
                this.switchTab('syllabus');
                this.updateHeaderMetrics();
                this.refreshIcons();
            }

            applyTheme(theme) {
                const isDark = theme === 'dark';
                document.documentElement.classList.toggle('dark', isDark);
                const btn = document.getElementById('theme-toggle-btn');
                if (btn) {
                    btn.innerHTML = isDark
                        ? `<i data-lucide="sun" class="w-3.5 h-3.5 text-amber-300"></i><span class="hidden sm:inline">Modo Claro</span>`
                        : `<i data-lucide="moon" class="w-3.5 h-3.5 text-accent-600"></i><span class="hidden sm:inline">Modo Oscuro</span>`;
                }
                this.refreshIcons();
            }

            toggleTheme() {
                const next = this.storage.state.theme === 'dark' ? 'light' : 'dark';
                this.storage.state.theme = next;
                this.storage.save();
                this.applyTheme(next);
                this.showToast(next === 'dark' ? '🌙 Modo oscuro activado' : '☀️ Modo claro activado');
            }

            refreshIcons() {
                if (window.lucide && typeof window.lucide.createIcons === 'function') {
                    window.lucide.createIcons();
                }
            }

            showToast(msg) {
                const toast = document.getElementById('toast');
                if (!toast) return;
                toast.textContent = msg;
                toast.classList.remove('opacity-0');
                clearTimeout(this.toastTimer);
                this.toastTimer = setTimeout(() => {
                    toast.classList.add('opacity-0');
                }, 3200);
            }

            awardXP(amount, skillKey = null) {
                const st = this.storage.state;
                st.xp += amount;
                st.dailyXP += amount;

                if (skillKey && typeof st.skills[skillKey] === 'number') {
                    st.skills[skillKey] = Math.min(100, st.skills[skillKey] + 3);
                }

                if (st.dailyXP >= st.dailyGoal && !st.dailyBonusClaimed) {
                    st.dailyBonusClaimed = true;
                    st.xp += 50;
                    this.showToast('🎉 ¡Meta diaria cumplida! +50 XP de bonificación');
                }

                this.storage.save();
                this.updateHeaderMetrics();
            }

            updateHeaderMetrics() {
                const st = this.storage.state;
                const xpEl = document.getElementById('xp-count');
                const streakEl = document.getElementById('streak-count');
                const dailyText = document.getElementById('daily-xp-text');
                const dailyBar = document.getElementById('daily-xp-bar');
                const badge = document.getElementById('notebook-badge');

                if (xpEl) xpEl.textContent = `${st.xp} XP`;
                if (streakEl) streakEl.textContent = `${st.streak}`;
                if (dailyText) dailyText.textContent = `${st.dailyXP}/${st.dailyGoal}`;
                if (dailyBar) {
                    const pct = Math.min(100, Math.round((st.dailyXP / st.dailyGoal) * 100));
                    dailyBar.style.width = `${pct}%`;
                }
                if (badge) badge.textContent = `${st.notebook.length}`;
            }

            setLevel(level, silent = false) {
                if (!LEVEL_ORDER.includes(level)) return;
                this.storage.state.level = level;
                this.storage.save();

                document.querySelectorAll('.level-btn').forEach(btn => {
                    const active = btn.dataset.level === level;
                    btn.className = active
                        ? 'level-btn min-h-[34px] px-2.5 py-1 rounded-lg text-xs font-extrabold bg-brand-600 text-white dark:bg-brand-500 dark:text-slate-950 shadow-sm transition-all'
                        : 'level-btn min-h-[34px] px-2.5 py-1 rounded-lg text-xs font-extrabold text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-all';
                });

                this.syllabus.resetForLevel();
                this.syllabus.render();
                this.practice.loadForLevel(level);
                this.voice.reset();

                if (!silent) {
                    this.showToast(`Nivel CEFR cambiado a ${level}`);
                }
            }

            switchTab(tab) {
                this.activeTab = tab;
                const views = ['syllabus', 'practice', 'voice', 'notebook'];
                views.forEach(v => {
                    const sec = document.getElementById(`view-${v}`);
                    const btn = document.getElementById(`tab-${v}`);
                    const isSelected = v === tab;
                    if (sec) sec.classList.toggle('hidden', !isSelected);
                    if (btn) {
                        btn.className = isSelected
                            ? 'nav-tab min-h-[42px] flex items-center justify-center gap-2 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold bg-brand-600 text-white dark:bg-brand-500 dark:text-slate-950 shadow-md shadow-brand-500/15 transition-all'
                            : 'nav-tab min-h-[42px] flex items-center justify-center gap-2 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold text-slate-600 hover:text-slate-900 hover:bg-stone-100 dark:text-slate-400 dark:hover:text-white dark:hover:bg-slate-800/60 transition-all';
                    }
                });

                if (tab === 'syllabus') this.syllabus.render();
                if (tab === 'practice') this.practice.render();
                if (tab === 'voice') this.voice.render();
                if (tab === 'notebook') this.notebook.render();
            }

            openModal() {
                if (this.modalBackdrop) this.modalBackdrop.classList.remove('hidden');
            }

            closeModal() {
                if (this.modalBackdrop) this.modalBackdrop.classList.add('hidden');
                this.speech.cancelSpeech();
            }

            bindGlobalEvents() {
                document.addEventListener('click', (e) => {
                    const target = e.target.closest('[data-action]');
                    if (!target) {
                        if (e.target === this.modalBackdrop) this.closeModal();
                        return;
                    }

                    const action = target.dataset.action;
                    switch (action) {
                        case 'toggle-theme':
                            this.toggleTheme();
                            break;
                        case 'set-level':
                            this.setLevel(target.dataset.level);
                            break;
                        case 'switch-tab':
                            this.switchTab(target.dataset.tab);
                            break;
                        case 'open-syntax':
                            this.syntax.open();
                            break;
                        case 'open-placement':
                            this.placement.open();
                            break;
                        case 'open-skills':
                            this.skills.open();
                            break;
                        case 'open-ai-settings':
                            this.aiSettings.open();
                            break;
                        case 'save-ai-key':
                            this.aiSettings.saveKey();
                            break;
                        case 'clear-ai-key':
                            this.aiSettings.clearKey();
                            break;
                        case 'close-modal':
                            this.closeModal();
                            break;
                        case 'inspect-word':
                            this.lexicon.inspect(target.dataset.word);
                            break;
                        case 'close-inspector':
                            this.lexicon.close();
                            break;
                        case 'save-inspected-word':
                            this.lexicon.saveCurrent();
                            break;
                        case 'speak-text':
                            this.speech.speak(target.dataset.speak, parseFloat(target.dataset.rate || '1.0'));
                            break;
                        case 'select-module':
                            this.syllabus.selectedModule = target.dataset.module;
                            this.syllabus.render();
                            break;
                        case 'clear-syllabus-search':
                            this.syllabus.searchQuery = '';
                            this.syllabus.render();
                            break;
                        case 'toggle-studied': {
                            const id = target.dataset.topicId;
                            const arr = this.storage.state.studiedTopics;
                            const idx = arr.indexOf(id);
                            if (idx >= 0) {
                                arr.splice(idx, 1);
                            } else {
                                arr.push(id);
                                this.awardXP(10, 'grammar');
                            }
                            this.storage.save();
                            this.syllabus.render();
                            break;
                        }
                        case 'practice-topic':
                            this.switchTab('practice');
                            this.practice.loadForLevel(this.storage.state.level, target.dataset.topicTitle);
                            break;
                        case 'practice-filter':
                            this.practice.filterType = target.dataset.filter;
                            this.practice.applyFilter();
                            break;
                        case 'clear-topic-focus':
                            this.practice.topicFocus = '';
                            this.practice.render();
                            break;
                        case 'generate-ai-practice':
                            this.practice.generateNewSet();
                            break;
                        case 'goto-step':
                            this.practice.currentStep = parseInt(target.dataset.step, 10) || 0;
                            this.practice.render();
                            break;
                        case 'prev-step':
                            this.practice.prevStep();
                            break;
                        case 'next-step':
                            this.practice.nextStep();
                            break;
                        case 'select-abcd':
                            this.practice.handleAbcdAnswer(parseInt(target.dataset.optIdx, 10));
                            break;
                        case 'check-cloze':
                            this.practice.handleClozeCheck();
                            break;
                        case 'check-rewrite':
                            this.practice.handleRewriteCheck();
                            break;
                        case 'check-dictation':
                            this.practice.handleDictationCheck();
                            break;
                        case 'restart-practice':
                            this.practice.sessionAnswers = {};
                            this.practice.currentStep = 0;
                            this.practice.render();
                            break;
                        case 'toggle-scaffolding':
                            this.voice.showScaffolding = !this.voice.showScaffolding;
                            this.voice.render();
                            break;
                        case 'toggle-hands-free':
                            this.voice.toggleHandsFree();
                            break;
                        case 'use-scaffold': {
                            const inp = document.getElementById('voice-text-input');
                            if (inp) {
                                inp.value = target.dataset.phrase;
                                inp.focus();
                            }
                            break;
                        }
                        case 'reset-voice':
                            this.voice.reset();
                            break;
                        case 'toggle-mic':
                            this.voice.toggleMicrophone();
                            break;
                        case 'flush-mic':
                            this.speech.flushPending();
                            break;
                        case 'send-voice-text':
                            this.voice.sendDraftText();
                            break;
                        case 'start-shadowing':
                            this.voice.startShadowing(target.dataset.speak);
                            break;
                        case 'cancel-shadowing':
                            this.voice.shadowingTarget = null;
                            this.voice.shadowingResult = null;
                            this.voice.render();
                            break;
                        case 'toggle-msg-translation':
                            this.voice.toggleTranslation(parseInt(target.dataset.msgIdx, 10));
                            break;
                        case 'check-recall':
                            this.notebook.checkRecall(parseInt(target.dataset.idx, 10));
                            break;
                        case 'master-notebook-item':
                            this.notebook.masterItem(parseInt(target.dataset.idx, 10));
                            break;
                        case 'delete-notebook-item':
                            this.notebook.deleteItem(parseInt(target.dataset.idx, 10));
                            break;
                        case 'placement-abcd':
                            this.placement.submitAbcd(parseInt(target.dataset.optIdx, 10));
                            break;
                        case 'placement-cloze':
                            this.placement.submitCloze();
                            break;
                        case 'placement-finish-early':
                            this.placement.renderReport();
                            break;
                        case 'apply-placed-level':
                            this.closeModal();
                            this.setLevel(target.dataset.level);
                            break;
                        case 'restart-placement':
                            this.placement.open();
                            break;
                        case 'syntax-pick-token':
                            this.syntax.pickToken(parseInt(target.dataset.tokenIdx, 10));
                            break;
                        case 'syntax-remove-token':
                            this.syntax.removeToken(parseInt(target.dataset.posIdx, 10));
                            break;
                        case 'syntax-clear':
                            this.syntax.clear();
                            break;
                        case 'syntax-check':
                            this.syntax.check();
                            break;
                        case 'syntax-next':
                            this.syntax.next();
                            break;
                        case 'skills-go': {
                            const dest = target.dataset.target;
                            this.closeModal();
                            if (dest === 'syntax') {
                                this.syntax.open();
                            } else if (dest === 'voice') {
                                this.switchTab('voice');
                            } else if (dest === 'dictation') {
                                this.switchTab('practice');
                                this.practice.filterType = 'DICTATION';
                                this.practice.applyFilter();
                            } else {
                                this.switchTab('practice');
                            }
                            break;
                        }
                    }
                });

                document.addEventListener('input', (e) => {
                    const kind = e.target.dataset.input;
                    if (kind === 'syllabus-search') {
                        this.syllabus.searchQuery = e.target.value;
                        this.syllabus.render();
                    } else if (kind === 'tts-rate') {
                        this.voice.ttsRate = parseFloat(e.target.value) || 1.0;
                        this.voice.render();
                    }
                });

                document.addEventListener('change', (e) => {
                    const kind = e.target.dataset.change;
                    if (kind === 'voice-scenario') {
                        this.voice.scenario = e.target.value;
                        this.voice.reset();
                    } else if (kind === 'voice-mode') {
                        this.voice.mode = e.target.value;
                        this.voice.render();
                    }
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && !this.modalBackdrop.classList.contains('hidden')) {
                        this.closeModal();
                        return;
                    }

                    const activeTag = document.activeElement?.tagName;
                    const isTyping = activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT';

                    if (e.key === 'Enter' && isTyping) {
                        const enterAction = document.activeElement.dataset.enter;
                        if (enterAction === 'check-cloze') {
                            e.preventDefault();
                            this.practice.handleClozeCheck();
                        } else if (enterAction === 'check-dictation') {
                            e.preventDefault();
                            this.practice.handleDictationCheck();
                        } else if (enterAction === 'send-voice-text') {
                            e.preventDefault();
                            this.voice.sendDraftText();
                        } else if (enterAction === 'placement-cloze') {
                            e.preventDefault();
                            this.placement.submitCloze();
                        } else if (enterAction === 'check-recall') {
                            e.preventDefault();
                            this.notebook.checkRecall(parseInt(document.activeElement.dataset.idx, 10));
                        }
                        return;
                    }

                    if (!isTyping && this.activeTab === 'practice' && this.modalBackdrop.classList.contains('hidden')) {
                        const current = this.practice.getCurrentExercise();
                        if (!current) return;
                        const { realIdx, ex } = current;
                        const ans = this.practice.sessionAnswers[realIdx];

                        if (ex.type === 'ABCD' && !ans?.answered) {
                            const keyMap = { a: 0, '1': 0, b: 1, '2': 1, c: 2, '3': 2, d: 3, '4': 3 };
                            const k = e.key.toLowerCase();
                            if (k in keyMap) {
                                e.preventDefault();
                                this.practice.handleAbcdAnswer(keyMap[k]);
                            }
                        } else if (e.key === 'Enter' && ans?.answered) {
                            e.preventDefault();
                            this.practice.nextStep();
                        }
                    }
                });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.fluentApp = new FluentLabApp();
            window.fluentApp.init();
        });
    </script>
</body>
</html>
